            address:
              $ref: '#/components/schemas/AddressStruct'
            status:
              $ref: '#/components/schemas/StatusStruct'
          type: object
    Product:
      title: Product
      description: 'Base class for products, which can be either service products or articles.'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/ChatableEntityModel'
        -
          properties:
            type:
              description: 'Product type'
              type: string
              enum:
                - SERVICE_PRODUCT
                - ARTICLE
            name:
              description: 'Name of the product'
              type: string
            price:
              description: 'Unit price of the product'
              type: number
              format: float
              nullable: true
            unit:
              description: 'Unit of measurement for the product'
              type: string
              nullable: true
            description:
              description: 'Description of the product'
              type: string
              nullable: true
            numberExtern:
              description: 'External product number (for supplier or external reference)'
              type: string
              nullable: true
            prices:
              description: 'List of prices for the product'
              type: array
              items:
                $ref: '#/components/schemas/ProductPrice'
            bookingAccountNumber:
              description: 'DATEV booking account number for the product. If not set, the default booking account number of the tax rate will be used.'
              type: string
              nullable: true
            skontoBookingAccountNumber:
              description: 'DATEV booking account number for Skonto for the product. If not set, the default of the tax rate will be used.'
              type: string
              nullable: true
            comment:
              description: 'Comment for the product'
              type: string
              nullable: true
            attachmentIds:
              description: 'List of attachment IDs associated with the product'
              type: array
              items:
                type: string
                format: objectid
          type: object
    ProductPrice:
      title: ProductPrice
      description: 'Represents the price of a product, including sell and buy prices, currency, tax, and optional comment.'
      properties:
        sellPrice:
          title: 'Sell Price'
          description: 'The selling price of the product.'
          type: number
          format: float
          example: 19.99
        buyPrice:
          title: 'Buy Price'
          description: 'The buying price of the product, if applicable.'
          type: number
          format: float
          example: 15
          nullable: true
        currency:
          title: Currency
          description: 'The currency of the product price, represented as an ISO 4217 currency code.'
          type: string
          example: EUR
        tax:
          description: 'The tax rate applied to the product price, represented as a percentage (0 to 1). Deprecated, use taxRateId instead.'
          type: number
          format: float
          example: 0.19
          deprecated: true
        taxRateId:
          title: 'Tax Rate ID'
          description: 'The ID of the tax rate associated with the product price.'
          type: string
          format: object-id
          example: 60c72b2f9b1e8d3f4c8b4567
        comment:
          description: 'Any additional comments'
          type: string
          nullable: true
      type: object
    ServiceProduct:
      title: 'Service Product'
      description: 'A service product is a type of product with a wage cost factor and no purchase price. It is used for services that are billed based on time or effort rather than a fixed price per unit.'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/Product'
        -
          properties:
            type:
              description: 'Type of the product'
              type: string
              example: SERVICE_PRODUCT
            wageCostFactor:
              description: 'Wage cost factor for the service product'
              type: number
              format: float
              nullable: true
          type: object
    QualityControl:
      title: 'Quality Control'
      description: 'Quality control assessment for objects and rooms including ratings, comments, and detailed room checks'
      required:
        - rating
        - objectId
      type: object
      allOf:
        -
          $ref: '#/components/schemas/Entity'
        -
          properties:
            _id:
              description: 'Unique identifier for the quality control entry'
              type: string
              format: objectid
            rating:
              description: 'Overall quality rating (0.0 to 5.0)'
              type: number
              format: float
              maximum: 5
              minimum: 0
              example: 4.5
            comment:
              description: 'General comments about the quality control assessment'
              type: string
              nullable: true
            objectId:
              description: 'ID of the object being assessed'
              type: string
              format: objectid
            objectManagerId:
              description: 'ID of the object manager who performed the assessment'
              type: string
              format: objectid
            verified:
              description: 'Whether the quality control has been verified'
              type: boolean
              default: false
            roomChecks:
              description: 'Detailed room-by-room quality checks'
              type: array
              items:
                properties:
                  roomId: { description: 'Room ID', type: string, format: objectid }
                  levelId: { description: 'Level ID', type: string, format: objectid }
                  comment: { description: 'Room-specific comments', type: string }
                  serviceChecks: { description: 'Service type evaluations for this room', type: array, items: { properties: { serviceTypeId: { description: 'Service type ID', type: string, format: objectid }, evaluation: { description: 'Evaluation score', type: number }, evaluationType: { description: 'Type of evaluation', type: string }, rated: { description: 'Whether this service was rated', type: boolean } }, type: object } }
                  controlImages: { description: 'Images associated with this room check', type: array, items: { properties: { imageURL: { description: 'URL of the image', type: string, format: uri }, comment: { description: 'Image description/comment', type: string }, label: { description: 'Image label', type: string } }, type: object } }
                type: object
            images:
              description: 'General images for this quality control'
              type: array
              items:
                type: string
                format: uri
            status:
              $ref: '#/components/schemas/StatusStruct'
          type: object
    PayType:
      title: 'Pay Type'
      description: 'Base pay type entity that can be either salary or absence type'
      required:
        - name
        - number
        - type
      type: object
      allOf:
        -
          $ref: '#/components/schemas/Entity'
        -
          properties:
            _id:
              description: 'Unique identifier for the pay type'
              type: string
              format: objectid
            name:
              description: 'Name of the pay type'
              type: string
              example: 'Regular Hours'
            number:
              description: 'Numeric identifier for the pay type'
              type: integer
              example: 100
            type:
              description: 'Type of pay type (salary or absence)'
              type: string
              enum:
                - salary
                - absence
              example: salary
          type: object
    PayTypeAbsence:
      title: 'Pay Type Absence'
      description: 'Absence pay type for vacation, sickness, and other absence types'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/PayType'
        -
          properties:
            type:
              description: 'Type is always "absence" for absence pay types'
              type: string
              enum:
                - absence
              example: absence
            reduceVacationDays:
              description: 'Whether this absence type reduces vacation days'
              type: boolean
              example: false
            paidAbsence:
              description: 'Whether this absence type is paid'
              type: boolean
              example: true
            requestable:
              description: 'Whether users can request this absence type'
              type: boolean
              example: true
            editable:
              description: 'Whether this absence type can be edited'
              type: boolean
              example: true
            hexCode:
              description: 'Color hex code for this absence type'
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
              example: '#34c759'
          type: object
    PayTypeSalary:
      title: 'Pay Type Salary'
      description: 'Salary pay type with wage information and surcharges'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/PayType'
        -
          properties:
            description:
              description: 'Description of the salary pay type'
              type: string
              nullable: true
            wage:
              description: 'Base wage per hour'
              type: number
              format: float
              example: 15.5
            wageCost:
              description: 'Total wage cost including taxes and other costs'
              type: number
              format: float
              example: 18.6
            surcharges:
              description: 'Associated surcharges for this pay type'
              type: array
              items:
                $ref: '#/components/schemas/PayTypeSurcharge'
              nullable: true
            type:
              description: 'Type is always "salary" for salary pay types'
              type: string
              enum:
                - salary
              example: salary
          type: object
    Salary:
      title: Salary
      description: 'A salary record representing payment information for work performed by a user. Inherits common fields from ChatableEntityModel.'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/ChatableEntityModel'
        -
          properties:
            userId:
              description: 'User ID who earned this salary'
              type: string
              format: objectid
            timeTrackingId:
              description: 'Time tracking entry ID this salary is based on'
              type: string
              format: objectid
            billed:
              description: 'Whether this salary has been billed'
              type: boolean
            type:
              description: 'Type of salary (regular, overtime, etc.)'
              type: string
            objectId:
              description: 'Object ID where the work was performed'
              type: string
              format: objectid
            workingTime:
              description: 'Actual working time in seconds'
              type: integer
            targetTime:
              description: 'Target working time in seconds'
              type: integer
            salaryPerHour:
              description: 'Hourly salary rate'
              type: number
              format: float
            salary:
              description: 'Total salary amount'
              type: number
              format: float
            reason:
              description: 'Reason or description for this salary entry'
              type: string
            approvedByUserId:
              description: 'User ID who approved this salary'
              type: string
              format: objectid
            updatedByUserId:
              description: 'User ID who last updated this salary'
              type: string
              format: objectid
            from:
              description: 'Start date/time for this salary period'
              type: string
              format: date-time
            to:
              description: 'End date/time for this salary period'
              type: string
              format: date-time
            addedTime:
              description: 'Additional time added by object manager in seconds'
              type: integer
            break:
              description: 'Break time in seconds'
              type: integer
            minBreakTime:
              description: 'Minimum break time required in seconds'
              type: integer
            absenceId:
              description: 'Only set when type = Salary Absence'
              type: string
              format: objectid
            jobId:
              description: 'Job ID this salary is associated with'
              type: string
              format: objectid
            trackingJobDate:
              description: 'Date/time when job tracking was started'
              type: string
              format: date-time
            ignoreDoubleSalaries:
              description: 'Whether to ignore double salary checks'
              type: boolean
            roundedUp:
              description: 'Whether working time was rounded up'
              type: boolean
            roundUpSeconds:
              description: 'Seconds that were rounded up'
              type: integer
            payType:
              description: 'Pay type classification'
              type: string
            nightWorkingTime:
              description: 'Total working time during night hours in seconds (deprecated - use surcharges)'
              type: integer
              deprecated: true
            sundayWorkingTime:
              description: 'Total working time on Sunday in seconds (deprecated - use surcharges)'
              type: integer
              deprecated: true
            publicHolidayWorkingTime:
              description: 'Total working time on public holidays in seconds (deprecated - use surcharges)'
              type: integer
              deprecated: true
            surcharges:
              description: 'Array of salary surcharges for special work conditions (night, weekend, holiday, etc.)'
              type: array
              items:
                $ref: '#/components/schemas/SurchargeOnSalary'
            drivingTime:
              description: 'Total driving time in seconds'
              type: integer
            assignmentId:
              description: 'Assignment ID this salary belongs to'
              type: string
              format: objectid
            activityTypeId:
              description: 'Activity type ID for categorizing work'
              type: string
              format: objectid
            releasedBySystem:
              description: 'Indicates if this salary was released by the system'
              type: boolean
              nullable: true
          type: object
    SurchargeOnSalary:
      title: 'Surcharge on Salary'
      description: 'Represents a surcharge applied to a salary for special work conditions like night hours, weekends, holidays, or driving time.'
      required:
        - seconds
      type: object
      allOf:
        -
          $ref: '#/components/schemas/Entity'
        -
          properties:
            surchargeId:
              description: 'Surcharge ID reference'
              type: string
              format: objectid
            name:
              description: 'Name of the surcharge (e.g., "Night Shift", "Weekend", "Holiday")'
              type: string
            number:
              description: 'Surcharge number for ordering/display purposes'
              type: integer
            surcharge:
              description: 'Surcharge percentage (e.g., 25 for 25% surcharge)'
              type: number
              format: float
            activeOn:
              description: 'Configuration defining when this surcharge is active'
              type: object
            userId:
              description: 'User ID (used in salary export rows)'
              type: string
              format: objectid
            date:
              description: 'Date (used in salary export rows)'
              type: string
              format: date
            seconds:
              description: 'Duration of the surcharge application in seconds'
              type: integer
              minimum: 0
            activeTimeFrames:
              description: 'Time frames when this surcharge was active during the salary period'
              type: array
              items:
                properties:
                  from: { description: 'Start time of the surcharge period', type: string, format: date-time }
                  to: { description: 'End time of the surcharge period', type: string, format: date-time }
                type: object
            _cash:
              description: 'Calculated cash amount for this surcharge (available in combined calculations)'
              type: number
              format: float
              default: 0
          type: object
    SalaryResponse:
      title: 'Salary Response'
      description: 'Enhanced salary response with populated user, object, and activity type information. This extends the base Salary model with computed fields for API consumption.'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/Salary'
        -
          properties:
            user:
              $ref: '#/components/schemas/User'
            object:
              $ref: '#/components/schemas/CustomerObject'
            objectManager:
              $ref: '#/components/schemas/User'
            approvedByUser:
              $ref: '#/components/schemas/User'
            updatedBy:
              $ref: '#/components/schemas/User'
            activityType:
              $ref: '#/components/schemas/ActivityType'
            customer:
              $ref: '#/components/schemas/Customer'
          type: object
    PayTypeSurcharge:
      title: 'Pay Type Surcharge'
      description: 'A surcharge configuration that defines additional compensation based on time, day, activity type, or holidays'
      required:
        - name
        - surcharge
        - number
        - activeOn
      type: object
      allOf:
        -
          $ref: '#/components/schemas/Entity'
        -
          properties:
            _id:
              description: 'Unique identifier for the surcharge'
              type: string
              format: objectid
            name:
              description: 'Name of the surcharge (e.g. "Night shift", "Sunday work", "Holiday pay")'
              type: string
              example: 'Night shift surcharge'
            surcharge:
              description: 'Surcharge percentage (e.g. 30 for 30% surcharge)'
              type: number
              format: float
              minimum: 0
              example: 30
            wage:
              description: 'Fixed wage amount for this surcharge (alternative to percentage)'
              type: number
              format: float
              minimum: 0
              example: 15.5
            number:
              description: 'Unique number identifier for payroll systems'
              type: integer
              example: 500
            activeOn:
              description: 'When this surcharge is active'
              type: string
              enum:
                - days
                - activity_types
                - holidays
              example: days
            activeWeekdays:
              description: 'Weekdays when surcharge is active (used when activeOn is "days")'
              type: array
              items:
                type: string
                enum:
                  - MO
                  - TU
                  - WE
                  - TH
                  - FR
                  - SA
                  - SU
              example:
                - SA
                - SU
            activeFrom:
              description: 'Start time in military format (e.g. 2200 for 22:00)'
              type: integer
              maximum: 2359
              minimum: 0
              example: 2200
            activeTo:
              description: 'End time in military format (e.g. 600 for 06:00)'
              type: integer
              maximum: 2359
              minimum: 0
              example: 600
            activityTypeIds:
              description: 'Activity type IDs when surcharge is active (used when activeOn is "activity_types")'
              type: array
              items:
                type: string
                format: objectid
              example:
                - 507f1f77bcf86cd799439011
                - 507f1f77bcf86cd799439012
            holidayNames:
              description: 'Holiday names when surcharge is active (used when activeOn is "holidays")'
              type: array
              items:
                type: string
              example:
                - Christmas
                - 'New Year'
                - Easter
            payTypeIds:
              description: 'Pay type IDs this surcharge is applied to'
              type: array
              items:
                type: string
                format: objectid
              example:
                - 507f1f77bcf86cd799439013
          type: object
    SearchResponseItem:
      title: 'Search Response'
      description: 'Represents a single item in the search response, containing details about the entity and its relevance to the search query.'
      required:
        - title
        - type
        - _id
        - similarity
        - entityResponse
      properties:
        title:
          description: 'Title of the search result item, typically the name or identifier of the entity'
