openapi: 3.0.0
info:
  title: 'PlanD API'
  description: 'PlanD Public API'
  version: '2'
servers:
  -
    url: 'http:localhost:3000/v2'
    description: 'Local Server'
  -
    url: 'https://beta-api.pland.app/v2'
    description: 'Sandbox Server'
  -
    url: 'https://cloud-api.pland.app/v2'
    description: 'Production Server'
paths:
  /absences/:
    get:
      tags:
        - Absences
      summary: 'List absences'
      description: 'List all absences in the system with optional filtering, pagination, and sorting capabilities. Supports filtering by status, dates, users, pay types, and more.'
      operationId: listAbsences
      parameters:
        -
          name: limit
          in: query
          description: 'Maximum number of absences to return'
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
            minimum: 1
        -
          name: offset
          in: query
          description: 'Number of absences to skip for pagination'
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        -
          name: sort
          in: query
          description: 'Sort field and direction (e.g. dtStart:1, status.createdAt:-1)'
          required: false
          schema:
            type: string
        -
          name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterStatus'
        -
          name: ids
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterIds'
        -
          name: user
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterUser'
        -
          name: userIds
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterUserIds'
        -
          name: objectManagers
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterObjectManagers'
        -
          name: notFinished
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterNotFinished'
        -
          name: assigned
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterAssigned'
        -
          name: object
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterObject'
        -
          name: end
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterEnd'
        -
          name: dtEndFrom
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterDTEndFrom'
        -
          name: dtEndTo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterDTEndTo'
        -
          name: dtStartTo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterDTStartTo'
        -
          name: absencePayType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterAbsencePayType'
        -
          name: userIdsByName
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterUserIdsByName'
        -
          name: absenceType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterAbsenceType'
        -
          name: affectedObjectIds
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterAffectedObjectIds'
        -
          name: employmentUserIds
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterEmploymentUserIds'
        -
          name: userIdsByTag
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterUserIdsByTag'
        -
          name: generalField
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GeneralFieldFilter'
      responses:
        '200':
          description: 'List of absences'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Absence'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: 'Error retrieving absences'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
    post:
      tags:
        - Absences
      summary: 'Create new absence'
      description: 'Create a new absence record for a user. Requires dtStart and dtEnd dates. If no userId is provided, creates absence for the authenticated user.'
      operationId: createAbsence
      requestBody:
        description: 'Absence data'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Absence'
      responses:
        '201':
          description: 'Absence created successfully'
          content:
            application/json:
              schema:
                properties:
                  absenceId: { description: 'ID of the created absence', type: string, format: objectid }
                type: object
        '400':
          description: 'Invalid input data or missing required fields'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '409':
          description: 'Absence already exists in this time frame'
        '500':
          description: 'Error creating absence'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  '/absences/{id}':
    get:
      tags:
        - Absences
      summary: 'Get absence by ID'
      description: 'Get a specific absence by its ID.'
      operationId: getAbsence
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID'
          required: true
          schema:
            type: string
            format: objectid
      responses:
        '200':
          description: 'Absence details'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error retrieving absence'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
    put:
      tags:
        - Absences
      summary: 'Update absence (full)'
      description: 'Fully update an absence record. All fields must be provided.'
      operationId: updateAbsenceFull
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID to update'
          required: true
          schema:
            type: string
            format: objectid
      requestBody:
        description: 'Complete absence data'
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Absence'
      responses:
        '200':
          description: 'Absence updated successfully'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
        '400':
          description: 'Invalid input data'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error updating absence'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
    delete:
      tags:
        - Absences
      summary: 'Delete absence'
      description: 'Delete an absence record by its ID.'
      operationId: deleteAbsence
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID to delete'
          required: true
          schema:
            type: string
            format: objectid
      responses:
        '200':
          description: 'Absence deleted successfully'
          content:
            application/json:
              schema:
                properties:
                  deleted: { type: boolean, example: true }
                type: object
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error deleting absence'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
    patch:
      tags:
        - Absences
      summary: 'Update absence'
      description: 'Update an existing absence record with new data. Only provided fields will be updated.'
      operationId: updateAbsence
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID to update'
          required: true
          schema:
            type: string
            format: objectid
      requestBody:
        description: 'Absence update data'
        required: true
        content:
          application/json:
            schema:
              properties:
                dtStart:
                  description: 'Start date/time of the absence (UTC timestamp)'
                  type: string
                  format: date-time
                  nullable: true
                dtEnd:
                  description: 'End date/time of the absence (UTC timestamp)'
                  type: string
                  format: date-time
                  nullable: true
                daysAbsent:
                  description: 'Number of days absent'
                  type: number
                  format: float
                  nullable: true
                type:
                  description: 'Absence type'
                  type: integer
                  nullable: true
                desc:
                  description: 'Description or comment for the absence'
                  type: string
                  nullable: true
                payTypeAbsenceId:
                  description: 'Pay type absence ID'
                  type: string
                  format: objectid
                  nullable: true
                calculationType:
                  description: 'Calculation type'
                  type: string
                  nullable: true
                imageIds:
                  description: 'Image IDs associated with the absence'
                  type: array
                  items: { type: string }
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Absence updated successfully'
          content:
            application/json:
              schema:
                properties:
                  updated: { type: boolean, example: true }
                type: object
        '400':
          description: 'Invalid input data'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error updating absence'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  /absences/self:
    get:
      tags:
        - Absences
      summary: 'List personal absences'
      description: 'List all absences for the current authenticated user. Returns absences with filtering, pagination, and sorting support.'
      operationId: listPersonalAbsences
      parameters:
        -
          name: limit
          in: query
          description: 'Maximum number of absences to return'
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
            minimum: 1
        -
          name: offset
          in: query
          description: 'Number of absences to skip for pagination'
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        -
          name: sort
          in: query
          description: 'Sort field and direction (e.g. dtStart:1, status.createdAt:-1)'
          required: false
          schema:
            type: string
        -
          name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterStatus'
        -
          name: ids
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterIds'
        -
          name: absencePayType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterAbsencePayType'
        -
          name: absenceType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterAbsenceType'
        -
          name: dtEndFrom
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterDTEndFrom'
        -
          name: dtEndTo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterDTEndTo'
        -
          name: dtStartTo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/FilterDTStartTo'
        -
          name: generalField
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/GeneralFieldFilter'
      responses:
        '200':
          description: 'List of personal absences'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Absence'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: 'Error retrieving personal absences'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  /absences/types:
    get:
      tags:
        - Absences
      summary: 'List requestable absence types'
      description: 'List all requestable absence types (pay types) that users can request for absences.'
      operationId: listRequestableAbsenceTypes
      responses:
        '200':
          description: 'List of requestable absence types'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayType'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: 'Error retrieving absence types'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  '/absences/{id}/replacement-jobs':
    get:
      tags:
        - Absences
      summary: 'Get absence replacement jobs'
      description: 'Get all replacement jobs created for a specific absence.'
      operationId: getAbsenceReplacementJobs
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID to get replacement jobs for'
          required: true
          schema:
            type: string
            format: objectid
      responses:
        '200':
          description: 'List of replacement jobs for the absence'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '400':
          description: 'Invalid absence ID'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error retrieving replacement jobs'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  '/absences/{id}/affected-jobs':
    get:
      tags:
        - Absences
      summary: 'Get absence affected jobs'
      description: 'Get all jobs affected by a specific absence during its time period.'
      operationId: getAbsenceAffectedJobs
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID to get affected jobs for'
          required: true
          schema:
            type: string
            format: objectid
      responses:
        '200':
          description: 'List of jobs affected by the absence'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
        '400':
          description: 'Invalid absence ID'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error retrieving affected jobs'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  '/absences/{id}/approve':
    post:
      tags:
        - Absences
      summary: 'Approve absence'
      description: 'Approve an absence request. Sets the approvedBy field to the current user ID.'
      operationId: approveAbsence
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID to approve'
          required: true
          schema:
            type: string
            format: objectid
      responses:
        '200':
          description: 'Absence approved successfully'
          content:
            application/json:
              schema:
                properties:
                  approved: { type: string, example: 'true' }
                type: object
        '400':
          description: 'Invalid absence ID'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error approving absence'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  /absences/approve-multiple:
    post:
      tags:
        - Absences
      summary: 'Approve multiple absences'
      description: 'Approve multiple absence requests in bulk. Returns results for each absence indicating success or failure.'
      operationId: approveMultipleAbsences
      requestBody:
        description: 'List of absence IDs to approve'
        required: true
        content:
          application/json:
            schema:
              required:
                - ids
              properties:
                ids:
                  description: 'Array of absence IDs to approve'
                  type: array
                  items: { type: string, format: objectid }
              type: object
      responses:
        '200':
          description: 'Bulk approval results'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { id: { description: 'Absence ID', type: string, format: objectid }, success: { description: 'Whether approval was successful', type: boolean }, error: { description: 'Error message if approval failed', type: string, nullable: true } }
                  type: object
        '400':
          description: 'Missing or invalid IDs'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: 'Error approving absences'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  '/absences/{id}/decline':
    post:
      tags:
        - Absences
      summary: 'Decline absence'
      description: 'Decline an absence request. Users with app-only access can only decline their own absences.'
      operationId: declineAbsence
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID to decline'
          required: true
          schema:
            type: string
            format: objectid
      requestBody:
        description: 'Decline data'
        required: false
        content:
          application/json:
            schema:
              properties:
                declineComment:
                  description: 'Optional comment explaining the decline reason'
                  type: string
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Absence declined successfully'
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 'Invalid absence ID'
        '401':
          description: Unauthorized
        '403':
          description: 'Forbidden - No access to decline this absence'
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error declining absence'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  '/absences/{id}/cancel':
    post:
      tags:
        - Absences
      summary: 'Cancel absence'
      description: 'Cancel an absence request. Different from decline - this is used to cancel/abort an absence.'
      operationId: cancelAbsence
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID to cancel'
          required: true
          schema:
            type: string
            format: objectid
      requestBody:
        description: 'Cancel data'
        required: false
        content:
          application/json:
            schema:
              properties:
                declineComment:
                  description: 'Optional comment explaining the cancellation reason'
                  type: string
                  nullable: true
              type: object
      responses:
        '200':
          description: 'Absence cancelled successfully'
          content:
            application/json:
              schema:
                type: object
        '400':
          description: 'Invalid absence ID'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error cancelling absence'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  '/absences/{id}/assign':
    post:
      tags:
        - Absences
      summary: 'Assign absence replacements'
      description: 'Assign replacement jobs to an absence to cover the work during the absence period.'
      operationId: assignAbsenceReplacements
      parameters:
        -
          name: id
          in: path
          description: 'Absence ID to assign replacements for'
          required: true
          schema:
            type: string
            format: objectid
      requestBody:
        description: 'Replacement assignments'
        required: true
        content:
          application/json:
            schema:
              required:
                - replacements
              properties:
                replacements:
                  description: 'Array of replacement job assignments'
                  type: array
                  items: { properties: { userId: { description: 'User ID of the replacement', type: string, format: objectid }, jobId: { description: 'Job ID to be replaced', type: string, format: objectid }, hours: { description: 'Number of hours for replacement', type: number, format: float } }, type: object }
              type: object
      responses:
        '200':
          description: 'Absence assignments completed'
          content:
            application/json:
              schema:
                properties:
                  replacements: { description: 'Updated replacement assignments', type: array, items: { type: object } }
                  errors: { description: 'Any errors that occurred during assignment', type: array, items: { type: string } }
                type: object
        '400':
          description: 'Invalid input data or missing replacements'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error assigning absence replacements'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  /absences/time-frame-check:
    get:
      tags:
        - Absences
      summary: 'Check for conflicting absences'
      description: 'Check if a user has any other active absences in the same time frame as a specified absence.'
      operationId: hasAbsenceInTimeFrame
      parameters:
        -
          name: absenceId
          in: query
          description: 'Absence ID to check against'
          required: true
          schema:
            type: string
            format: objectid
      responses:
        '200':
          description: 'Time frame check results'
          content:
            application/json:
              schema:
                properties:
                  hasAbsence: { description: 'Whether there is a conflicting absence', type: boolean }
                  absence: { oneOf: [{ $ref: '#/components/schemas/Absence' }], nullable: true, description: 'The conflicting absence if found' }
                type: object
        '400':
          description: 'Missing required parameter (absenceId)'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'Absence not found'
        '500':
          description: 'Error checking time frame'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  /absences/capacity:
    get:
      tags:
        - Absences
      summary: 'Calculate absence capacity by date range'
      description: 'Calculate active absences for every day in a specified date range. Returns capacity information.'
      operationId: calcActiveAbsencesForEveryDayInRange
      parameters:
        -
          name: from
          in: query
          description: 'Start date for the calculation (UTC timestamp)'
          required: true
          schema:
            type: integer
        -
          name: to
          in: query
          description: 'End date for the calculation (UTC timestamp)'
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'Absence capacity calculation results'
          content:
            application/json:
              schema:
                type: array
                items:
                  properties: { date: { description: Date, type: string, format: date }, absenceCount: { description: 'Number of active absences on this date', type: integer }, capacity: { description: 'Capacity details for this date', type: object } }
                  type: object
        '400':
          description: 'Missing required parameters (from, to)'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: 'Error calculating absence capacity'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  '/users/{userId}/vacationDays':
    get:
      tags:
        - Absences
        - Users
      summary: 'Get user vacation days'
      description: 'Calculate the available absence time for a user within a specified time frame. The calculation subtracts one second from the end date to avoid including absences that begin exactly at the end date.'
      operationId: getUserVacationDays
      parameters:
        -
          name: userId
          in: path
          description: 'User ID to calculate vacation days for'
          required: true
          schema:
            type: string
            format: objectid
        -
          name: from
          in: query
          description: 'Start date for the calculation period (UTC timestamp)'
          required: true
          schema:
            type: string
            format: date-time
        -
          name: to
          in: query
          description: 'End date for the calculation period (UTC timestamp)'
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: 'Available absence time calculated successfully'
          content:
            application/json:
              schema:
                description: 'Available absence time details'
                type: object
        '400':
          description: 'Missing required parameters (from, to)'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: 'User not found'
        '500':
          description: 'Error calculating available absence time'
      security:
        -
          API-Key: []
        -
          Bearer-Auth: []
  '/users/{userId}/daysAbsent':
    get:
      tags:
        - Absences
        - Users
      summary: 'Get user days absent'
      description: 'Get the number of days a user has been absent within a specified time frame. Returns detailed information about the user''s absence days.'
      operationId: getUserDaysAbsent
      parameters:
        -
          name: userId
          in: path
          description: 'User ID to get absence days for'
          required: true
          schema:
            type: string
            format: objectid
        -
          name: from
          in: query
          description: 'Start date for the absence period (UTC timestamp)'
          required: true
          schema:
            type: string
            format: date-time
        -
          name: to
          in: query
          description: 'End date for the absence period (UTC timestamp)'
          required: true
          schema:
            type: string
