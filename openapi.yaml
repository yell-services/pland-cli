      description: 'A dynamic filter that allows filtering on any field with various operators. Supports string, number, boolean, date, and objectid field types.'
      required:
        - key
        - value
        - operator
        - fieldType
      properties:
        key:
          description: 'The field path to filter on (supports dot notation for nested fields)'
          type: string
          example: customer.name
        value:
          description: 'The value to filter by'
          example: 'Example Company'
          oneOf:
            -
              type: string
            -
              type: number
            -
              type: boolean
            -
              type: array
              items:
                type: string
        operator:
          description: 'The comparison operator to use'
          type: string
          enum:
            - contains
            - equals
            - not_equals
            - greater_than
            - less_than
            - greater_equal
            - less_equal
            - in
            - not_in
            - exists
            - not_exists
            - regex
          example: contains
        fieldType:
          description: 'The data type of the field being filtered'
          type: string
          enum:
            - string
            - number
            - boolean
            - date
            - objectid
          example: string
      type: object
