components:
  schemas:
    Absence:
      title: Absence
      description: 'Absence record for a user, including type, dates, and affected jobs.'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/ChatableEntityModel'
        -
          properties:
            _id:
              description: 'Unique identifier for the absence'
              type: string
              format: objectid
            userId:
              description: 'User ID for whom the absence is recorded'
              type: string
              format: objectid
            type:
              description: 'Absence type (e.g., illness, vacation, unpaid leave)'
              type: integer
            payTypeAbsenceId:
              description: 'Pay type absence ID'
              type: string
              format: objectid
              nullable: true
            calculationType:
              description: 'Calculation type for the absence'
              type: string
              nullable: true
            desc:
              description: 'Description or comment for the absence'
              type: string
              nullable: true
            dtStart:
              description: 'Start date/time of the absence'
              type: string
              format: date-time
            dtEnd:
              description: 'End date/time of the absence'
              type: string
              format: date-time
            daysAbsent:
              description: 'Number of days absent'
              type: number
              format: float
            fullDay:
              description: 'Whether the absence is for a full day'
              type: boolean
            approvedBy:
              description: 'User ID who approved the absence'
              type: string
              format: objectid
              nullable: true
            declinedBy:
              description: 'User ID who declined the absence'
              type: string
              format: objectid
              nullable: true
            affectedJobs:
              description: 'List of job IDs affected by this absence'
              type: array
              items:
                type: string
                format: objectid
            isAssigned:
              description: 'Whether all replacement jobs are assigned'
              type: boolean
            attachments:
              description: 'Attachment IDs or file references'
              type: array
              items:
                type: string
            imageIds:
              description: 'Image IDs associated with the absence'
              type: array
              items:
                type: string
            objectManagerIds:
              description: 'IDs of object managers'
              type: array
              items:
                type: string
                format: objectid
            declineComment:
              description: 'Comment for declined absence'
              type: string
              nullable: true
            sendEmailToCustomer:
              description: 'Whether to send an email to the customer'
              type: boolean
            affectedObjectIds:
              description: 'IDs of affected objects'
              type: array
              items:
                type: string
                format: objectid
            absencePaidTimeArray:
              description: 'Paid time for each day of the absence'
              type: array
              items:
                type: object
            replacements:
              description: 'Replacement assignments for the absence'
              type: array
              items:
                type: object
            status:
              description: 'Status struct for the absence'
              type: object
          type: object
    RemainingLeaveStruct:
      title: 'Remaining Leave Days'
      description: 'Tracks remaining vacation days that can be carried over from previous years'
      properties:
        year:
          description: 'The year for which these remaining leave days apply'
          type: integer
          maximum: 2050
          minimum: 2020
          example: 2023
        days:
          description: 'Number of remaining leave days available to be used'
          type: integer
          minimum: 0
          example: 5
      type: object
    ActivityType:
      title: 'Activity Type'
      description: 'Activity type defines the category of work to be performed (e.g., cleaning, maintenance)'
      required:
        - name
      type: object
      allOf:
        -
          $ref: '#/components/schemas/Entity'
        -
          properties:
            _id:
              description: 'Unique identifier for the activity type'
              type: string
              format: objectid
            name:
              description: 'Name of the activity type'
              type: string
              example: Unterhaltsreinigung
            hexCode:
              description: 'Color code for visual representation in hex format'
              type: string
              pattern: '^#[0-9A-Fa-f]{6}$'
              example: '#34c759'
              nullable: true
            description:
              description: 'Detailed description of the activity type'
              type: string
              example: 'Regular maintenance cleaning activities'
              nullable: true
          type: object
    UserAnalyticsStruct:
      title: 'User Analytics Data'
      description: 'Analytics and performance tracking information for users'
      properties:
        createdProfile:
          description: 'Timestamp when the user profile was created or completed'
          type: string
          format: date-time
          example: '2023-01-15T09:00:00Z'
          nullable: true
      type: object
    ApiKey:
      title: 'API Key'
      description: 'Represents an API key with its metadata and status'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/Entity'
        -
          properties:
            key:
              description: 'The actual key'
              type: string
            name:
              description: 'The name of the API key'
              type: string
            userId:
              description: 'The user that created the API key'
              type: string
              format: objectid
            username:
              description: 'The user name the API key belongs to'
              type: string
            accessGroup:
              description: 'The access group of this API key'
              type: string
            isActive:
              description: 'Flag whether the key is active'
              type: boolean
            isDeleted:
              description: 'Flag whether the key has been deleted'
              type: boolean
            expiresAt:
              description: 'The expiration date'
              type: integer
            rotateAt:
              description: 'The rotation date'
              type: integer
          type: object
    Assignment:
      title: Assignment
      description: 'An Assignment acts as the overall structure for jobs. They contain information about what kind of work should be done, where it should be done and how it should be billed. Assignments can be used to track the time spent on a job, the materials used and the costs incurred.'
      type: object
      allOf:
        -
          $ref: '#/components/schemas/ChatableEntityModel'
        -
          properties:
            objectId:
              description: 'ID of the customer object where this assignment is performed'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439011
              nullable: true
            customerId:
              description: 'ID of the customer who owns this assignment'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439012
              nullable: true
            title:
              description: 'Title or name of the assignment'
              type: string
              example: 'Monthly Cleaning Service'
              nullable: true
            iCalendar:
              oneOf:
                -
                  $ref: '#/components/schemas/ICalendarStruct'
              nullable: true
              description: 'Calendar configuration defining when and how often this assignment occurs'
            material:
              description: 'Materials or products associated with this assignment'
              type: array
              items:
                type: object
              example:
                -
                  productId: 507f1f77bcf86cd799439013
                  quantity: 2
              nullable: true
            weeklyTimeBudget:
              description: 'Weekly time budget in hours for this assignment'
              type: number
              format: float
              example: 8.5
              nullable: true
            type:
              description: 'Type of assignment (normal, deployment, etc.)'
              type: string
              enum:
                - normal
                - deployment
              example: normal
            activityTypeId:
              description: 'ID of the activity type defining what kind of work is performed'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439014
              nullable: true
            comment:
              description: 'Additional comments or notes for this assignment'
              type: string
              example: 'Special instructions for weekend work'
              nullable: true
            commentRequired:
              description: 'Whether users are required to add comments when finishing work on this assignment'
              type: boolean
              example: false
            sign:
              description: 'Whether digital signature is required when completing work on this assignment'
              type: boolean
              example: false
            documentIds:
              description: 'Array of document IDs attached to this assignment'
              type: array
              items:
                type: string
                format: objectid
              example:
                - 507f1f77bcf86cd799439015
                - 507f1f77bcf86cd799439016
            billing:
              oneOf:
                -
                  $ref: '#/components/schemas/AssignmentBilling'
              nullable: true
              description: 'Billing configuration for this assignment including pricing and invoice settings'
            quota:
              $ref: '#/components/schemas/AssignmentQuota'
            autoGenerateInvoiceError:
              description: 'Error information from automatic invoice generation, if any'
              type: object
              nullable: true
            costUnit:
              description: 'The cost unit of the assignment. Can be set to an arbitrary string'
              type: string
              nullable: true
            jobChatId:
              description: 'ID of the chat that all jobs under this assignment share'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439017
              nullable: true
            linkedCache:
              description: 'Cached data linked to this assignment for performance optimization'
              type: array
              items:
                type: object
              nullable: true
          type: object
    AssignmentBilling:
      description: 'Base class for assignment billing types'
      properties:
        type:
          description: 'Type of billing'
          type: string
          enum:
            - MANUAL
            - RECURRING
            - ON_EVENT
        '':
          description: 'Array of positions/line items for invoice generation'
          type: array
          items:
            type: object
            oneOf:
              -
                $ref: '#/components/schemas/InvoicePosition'
              -
                $ref: '#/components/schemas/TextPosition'
              -
                $ref: '#/components/schemas/DynamicPosition'
        lastInvoiceDate:
          description: 'Date of the last invoice'
          type: string
          format: date-time
        defaultInvoiceTemplateId:
          description: 'Default invoice template ID for automatic invoice creation'
          type: string
          format: objectId
      type: object
    AssignmentQuota:
      description: 'The Assignment Quota defines the quota for an assignment'
      properties:
        enabled:
          description: 'Are quotas enabled'
          type: boolean
        quotaCalculation:
          description: 'How is the Assignment Quota calculated?'
          type: string
          enum:
            - once
            - weekly
            - monthly
        total:
          description: 'The quota total. The meaning of this value is dependent on the quotaCalculation'
          type: number
          format: float
        billingRateEnabled:
          description: 'Is the billing rate calculation enabled'
          type: boolean
        billingRateCalculation:
          description: 'Defines how the billingRate is calculated'
          type: string
          enum:
            - hourly
            - flat
            - dynamic
        billingRateAmount:
          description: 'The billing rate amount. The meaning of this value is dependent on the billingRateCalculation'
          type: number
          format: float
        expectedMargin:
          description: 'The Margin the customer expects. We use this number to calculate the real margin of the customer. Value should be between 0.0 - 1.0'
          type: number
          format: float
      type: object
    Call:
