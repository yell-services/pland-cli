    Complaint:
      title: Complaint
      description: 'Customer complaint or service ticket with comprehensive tracking and resolution capabilities'
      required:
        - desc
      type: object
      allOf:
        -
          $ref: '#/components/schemas/ChatableEntityModel'
        -
          properties:
            _id:
              description: 'Unique identifier for the complaint'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439011
            number:
              description: 'Sequential complaint number for easy reference'
              type: integer
              example: 1001
            objectId:
              description: 'ID of the customer object this complaint relates to'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439012
            roomDescription:
              description: 'Description of the specific room or area where the issue occurred'
              type: string
              example: 'Bathroom on 2nd floor, next to the elevator'
            desc:
              description: 'Detailed description of the complaint or issue'
              type: string
              example: 'The cleaning was not satisfactory. There were stains on the carpet and dust on the furniture.'
            contactName:
              description: 'Name of the person submitting the complaint'
              type: string
              example: 'John Smith'
            contact:
              $ref: '#/components/schemas/ContactStruct'
            priority:
              description: 'Priority level of the complaint (1=Low, 2=Medium, 3=High, 4=Critical)'
              type: integer
              maximum: 4
              minimum: 1
              example: 2
            generatedPriority:
              description: 'AI-generated priority level based on complaint content'
              type: integer
              maximum: 4
              minimum: 1
              example: 3
              nullable: true
            images:
              description: 'Images related to the complaint (evidence, before photos, etc.)'
              type: array
              items:
                type: string
                format: uri
              example:
                - 'https://example.com/complaint-image1.jpg'
                - 'https://example.com/complaint-image2.jpg'
            finishImages:
              description: 'Images showing the completed resolution (after photos, proof of work)'
              type: array
              items:
                type: string
                format: uri
              example:
                - 'https://example.com/resolution-image1.jpg'
              nullable: true
            status:
              $ref: '#/components/schemas/StatusStruct'
            objectManagerId:
              description: 'ID of the object manager responsible for this location'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439013
              nullable: true
            userId:
              description: 'ID of the user assigned to handle this complaint'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439014
              nullable: true
            assignedDate:
              description: 'Date and time when the complaint was assigned to a user'
              type: string
              format: date-time
              example: '2023-12-01T10:30:00Z'
              nullable: true
            finishedAt:
              description: 'Date and time when the complaint was marked as resolved'
              type: string
              format: date-time
              example: '2023-12-02T15:45:00Z'
              nullable: true
            finishedBy:
              description: 'ID of the user who marked the complaint as resolved'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439015
              nullable: true
            comment:
              description: 'Internal comment about the complaint resolution'
              type: string
              example: 'Issue resolved by deep cleaning the carpet and dusting all surfaces'
              nullable: true
            response:
              description: 'Response message sent to the customer'
              type: string
              example: 'Thank you for your feedback. We have addressed the cleaning issues and implemented additional quality checks.'
              nullable: true
            tags:
              description: 'AI-generated tags categorizing the complaint'
              type: array
              items:
                type: string
              example:
                - cleaning
                - carpet
                - quality
              nullable: true
            chatId:
              description: 'ID of the associated chat channel for this complaint'
              type: string
              format: objectid
              example: 507f1f77bcf86cd799439016
              nullable: true
            customFields:
              description: 'Custom field values specific to this complaint'
              type: object
              nullable: true
              additionalProperties: true
          type: object
