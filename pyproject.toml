[project]
name = "pland-cli"
version = "0.1.0"
description = "Inoffizielle, agent-native CLI für die pland.app API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["pland", "pland.app", "cli", "agent", "api-client", "skill", "claude", "codex"]
authors = [{ name = "yell-services" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
    "click-repl>=0.3",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    # Windows hat keine System-Zeitzonen-DB; zoneinfo (Europe/Berlin) braucht sie.
    "tzdata; platform_system == 'Windows'",
]

[project.urls]
Homepage      = "https://github.com/yell-services/pland-cli"
Repository    = "https://github.com/yell-services/pland-cli"
Issues        = "https://github.com/yell-services/pland-cli/issues"
Changelog     = "https://github.com/yell-services/pland-cli/blob/main/CHANGELOG.md"

[project.scripts]
pland = "pland_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pland_cli"]

[tool.hatch.build.targets.wheel.force-include]
"openapi.yaml" = "pland_cli/openapi.yaml"
"openapi.overlay.yaml" = "pland_cli/openapi.overlay.yaml"

[tool.ruff]
line-length = 100
target-version = "py311"

# Explizit gepinnt: ruff aendert sein Default-Ruleset zwischen Minors
# (0.16 zog E402 raus und S/BLE/PIE/DTZ rein → 75 neue Findings, alle
# Rauschen oder False Positives). Ohne select haengt CI am Tool-Default.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = ["live: echte API-Calls (opt-in, --run-live)"]

[tool.mypy]
exclude = ["src/pland_cli/commands/"]   # auto-generierter Code, nicht typgeprüft
