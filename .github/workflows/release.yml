# Triggered by pushing an annotated tag like ``v0.1.0``. Always creates a
# GitHub Release with auto-generated notes and the built wheel/sdist attached;
# also publishes to PyPI when Trusted Publishing is configured on the ``pypi``
# environment (otherwise that job is skipped cleanly instead of failing).
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write        # required to create GitHub Releases
  id-token: write        # required for PyPI Trusted Publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for auto-generated notes

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  github_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: false

  pypi_publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # Only runs when the maintainer has configured Trusted Publishing on
    # pypi.org and created a ``pypi`` environment on the repo. If either piece
    # is missing the job is skipped instead of failing the release.
    if: ${{ vars.PYPI_ENABLED == 'true' }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
