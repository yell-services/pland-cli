name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        # Cross-Platform-Smoke: macOS + Windows je auf einer stabilen Version.
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev
      - name: Tests (offline, ohne Key)
        run: uv run pytest -q -m "not live"
      # Lint/Typecheck sind OS-unabhängig — nur einmal auf Linux.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: uv run ruff check src tests
      - name: Typecheck
        if: matrix.os == 'ubuntu-latest'
        run: uv run mypy src/pland_cli/core src/pland_cli/utils src/pland_cli/enrichment
