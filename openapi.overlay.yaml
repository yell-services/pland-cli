# Corrections to openapi.yaml that pland.app has not published (yet).
#
# openapi.yaml is a verbatim copy of docs.pland.app — this file is layered on
# top at load time (see _codegen/spec.py). Every entry is verified against the
# live API (cloud-api.pland.app/v2); the date below says when. Once a point is
# fixed upstream, its entry here goes away.
#
# How entries are verified: a GET against the real API. When a route does not
# exist, the /{resource}/{id} fallback kicks in and the API answers with
# "Failed to parse Id: <segment>".

verified: 2026-08-09

# --- Operations the spec documents but the API does not serve ---------------
# Every one of these GETs answers "Failed to parse Id: <segment>", meaning the
# route does not exist. Only GET is removed; POST/PATCH/DELETE on the same
# paths are unverified and stay in place.
remove:
  /absences/capacity: [get]
  /absences/time-frame-check: [get]
  /absences/types: [get]
  /complaints/monitor: [get]
  /orders/monitor: [get]
  /qualityControl/monitor: [get]
  /salaries/jobOccurrencesWithoutSalaries: [get]
  /surcharges/count: [get]
  /surcharges/distinctValues: [get]
  # Not "Failed to parse Id" but "Method not allowed. Must be one of: POST".
  # /invoiceReminders/ was listed here too and that was wrong: on 2026-08-14 a
  # plain GET returned the reminder list. Whatever the earlier probe hit, the
  # route serves GET — removing it cost us the only way to reach a reminder by
  # its invoice, because nothing on the invoice carries the reminder id.
  /invoiceReminders/templates: [get]

  # Paths with {id} need a second oracle. When the route exists, an invalid ID
  # reaches the ID parser and the API reports "Error parsing ObjectId string" /
  # "Failed to parse Id" / "Missing parameters". If it stays at "Not found.",
  # the router never matched. Checked against 57 paths of the same shape, 49 of
  # which do reach the parser.
  /absences/{id}/affected-jobs: [get]
  /absences/{id}/replacement-jobs: [get]
  /complaints/{id}/generateResponse: [get]
  /jobs/{userId}/targetTime: [get]
  /articles/user/{userId}: [get]
  /qualityControl/object/{objectId}: [get]
  /qualityControl/objectManager/{id}: [get]
  /salaries/objects/{objectId}: [get]

# --- Query parameters the spec gets wrong -----------------------------------
# Corrections by parameter name, across all paths. `expect` is the number of
# matches in the raw spec — if it differs, something moved upstream and the
# entry wants revisiting (test_overlay_params_still_apply).
params:
  # The API expects `fieldKey` throughout. The spec writes `field` on 16 of 18
  # distinctValues endpoints and gets back
  # "Missing parameters. Required parameters are: fieldKey".
  # In the raw spec, `field` appears on distinctValues endpoints only.
  field:
    expect: 16
    set:
      name: fieldKey

  # The spec documents `name:1` everywhere, which the API rejects with
  # "Sorting needs by and direction". Verified: JSON works on all 35 GET
  # endpoints carrying a sort parameter, the colon form on none of them
  # (three ignore the parameter silently).
  sort:
    expect: 39   # in the raw spec; 2 of them sit on paths that `remove` deletes
    set:
      # Stays under 120 characters — beyond that the renderer truncates help text.
      description: >-
        Sort as JSON: {"by":"<field>","direction":1} (1 asc, -1 desc).
        The spec's "field:1" form returns 400.

# --- Endpoints the API serves but the spec does not document ----------------
# Found via a control probe: the response differs from the signature of a route
# on the same resource that is guaranteed not to exist. Only GET is verified —
# write operations are deliberately absent here.
#
# An entry may also replace an operation the spec describes wrongly; the whole
# operation object is substituted, so it repeats every field the original had.
paths:
  # Verified 2026-08-15 against cloud-api.pland.app/v2 by cancelling a real
  # 0 EUR invoice. The published body is wrong on two counts:
  #   {"ids": [...]}  -> 400 "Required parameters are: fakturaDocumentIds"
  #   canceledAtDate omitted (spec says optional, nullable) -> 500
  #     "setToCanceled(): Argument #2 ($canceledAtDate) must be of type
  #      MongoDB\BSON\UTCDateTime, null given"
  # So the field is named fakturaDocumentIds and the date is mandatory.
  /invoices/setToCanceled:
    post:
      tags: [Invoice]
      summary: 'Cancel invoices'
      description: 'Cancel one or more invoices by setting their status to canceled'
      operationId: setInvoicesCanceled
      requestBody:
        description: 'Invoice IDs and the date they count as canceled'
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetInvoicesCanceledRequest'}
      responses:
        '200': {description: 'Invoices canceled successfully'}
        '400': {description: 'Invalid input'}
        '401': {description: Unauthorized}
        '403': {description: Forbidden}
      security:
        - API-Key: []
        - Bearer-Auth: []

  /absences/count:
    get:
      tags: [Absences]
      operationId: countAbsences
      summary: Count absences
      responses:
        '200': {description: Count}

  /absences/countNewEntities:
    get:
      tags: [Absences]
      operationId: countNewAbsences
      summary: Count new absences
      responses:
        '200': {description: Count}

  /users/self:
    get:
      tags: [Users]
      operationId: getOwnUser
      summary: Get the user the API key belongs to
      responses:
        '200': {description: User}

  /objects/distinctValues:
    get:
      tags: [Customer Objects]
      operationId: getCustomerObjectDistinctValues
      summary: Distinct values for a customer object field
      parameters:
        - {name: fieldKey, in: query, required: true, schema: {type: string},
           description: Field name to get distinct values for}
      responses:
        '200': {description: Distinct values}

  /serviceReports/distinctValues:
    get:
      tags: [ServiceReport]
      operationId: getServiceReportDistinctValues
      summary: Distinct values for a service report field
      parameters:
        - {name: fieldKey, in: query, required: true, schema: {type: string},
           description: Field name to get distinct values for}
      responses:
        '200': {description: Distinct values}

  /tasks/countNewEntities:
    get:
      tags: [Tasks]
      operationId: countNewTasks
      summary: Count new tasks
      responses:
        '200': {description: Count}

  /timetracking/countNewEntities:
    get:
      tags: [Time Tracking]
      operationId: countNewTimeTrackings
      summary: Count new time trackings
      responses:
        '200': {description: Count}

  # Custom field definitions. The spec knows `customFields` only as a field on
  # /users/ and /objects/, not as a resource of its own.
  /customFields/:
    get:
      tags: [Custom Fields]
      operationId: listCustomFields
      summary: List custom field definitions
      parameters:
        - {name: limit, in: query, schema: {type: integer},
           description: Maximum number of items to return}
        - {name: offset, in: query, schema: {type: integer},
           description: Number of items to skip for pagination}
      responses:
        '200': {description: List of custom fields}

  /customFields/count:
    get:
      tags: [Custom Fields]
      operationId: countCustomFields
      summary: Count custom field definitions
      responses:
        '200': {description: Count}

  /customFields/distinctValues:
    get:
      tags: [Custom Fields]
      operationId: getCustomFieldDistinctValues
      summary: Distinct values for a custom field
      parameters:
        - {name: fieldKey, in: query, required: true, schema: {type: string},
           description: Field name to get distinct values for}
      responses:
        '200': {description: Distinct values}

  # Export jobs (exportStatus, type, summary, startedAt, acceptedExport).
  /exports/:
    get:
      tags: [Exports]
      operationId: listExports
      summary: List exports
      parameters:
        - {name: limit, in: query, schema: {type: integer},
           description: Maximum number of items to return}
        - {name: offset, in: query, schema: {type: integer},
           description: Number of items to skip for pagination}
      responses:
        '200': {description: List of exports}

  # Storno documents as a collection. The spec only reaches a storno through
  # /stornos/{id}, and nothing hands out that id: cancelling an invoice creates
  # a storno record behind the scenes, but the invoice keeps `stornoId: null`.
  # So a storno raised in error could be neither found nor deleted — the same
  # dead end the /invoiceReminders/ entry above describes.
  # Verified 2026-08-15: the collection answers 200 with 364 records, while the
  # control probe /stornos/definitelyNotARoute reports "Failed to parse Id",
  # i.e. no such route. `offset` only paginates together with `sort` — unsorted,
  # the server's order is not stable; core.pagination injects a sort already.
  /stornos/:
    get:
      tags: [Invoice Storno]
      operationId: listStornos
      summary: List storno documents
      parameters:
        - {name: limit, in: query, schema: {type: integer},
           description: Maximum number of items to return}
        - {name: offset, in: query, schema: {type: integer},
           description: Number of items to skip for pagination}
      responses:
        '200': {description: List of storno documents}

  /stornos/count:
    get:
      tags: [Invoice Storno]
      operationId: countStornos
      summary: Count storno documents
      responses:
        '200': {description: Count}

  /stornos/distinctValues:
    get:
      tags: [Invoice Storno]
      operationId: getStornoDistinctValues
      summary: Distinct values for a storno field
      parameters:
        - {name: fieldKey, in: query, required: true, schema: {type: string},
           description: Field name to get distinct values for}
      responses:
        '200': {description: Distinct values}

  # Collective-agreement templates (payTypeEntries, surchargeEntries) — the
  # template wizard from the pland release of 2026-05-22.
  /payTypeTemplates/:
    get:
      tags: [Pay Type Templates]
      operationId: listPayTypeTemplates
      summary: List pay type templates
      parameters:
        - {name: limit, in: query, schema: {type: integer},
           description: Maximum number of items to return}
        - {name: offset, in: query, schema: {type: integer},
           description: Number of items to skip for pagination}
      responses:
        '200': {description: List of pay type templates}

# --- Corrections to components/schemas --------------------------------------
# Merged per top-level key, so an entry that fixes `required` leaves the
# upstream `properties` alone. Reachable for callers via `pland schema <Name>`.
schemas:
  # Verified 2026-08-15: POST /invoices/ without `address` is rejected with
  # "Missing parameters. Required parameters are: customerId, positions,
  # currency, issuedOn, address". The other five are exactly the upstream
  # required list, so the API validates them as one set — but only the invoice
  # route was exercised, not the other document types sharing this base.
  FakturaDocument:
    required: [documentType, customerId, referenceId, issuedOn, currency, positions, address]

  # Body of POST /invoices/setToCanceled, named so `pland schema` can reach it;
  # the published spec only has it inline, and wrong. See the paths entry above.
  SetInvoicesCanceledRequest:
    title: Set Invoices Canceled Request
    description: 'Body for POST /invoices/setToCanceled. Both fields are required —
      the spec documents `ids` and an optional `canceledAtDate`, the API accepts
      neither.'
    type: object
    required: [fakturaDocumentIds, canceledAtDate]
    properties:
      fakturaDocumentIds:
        description: 'IDs of the invoices to cancel'
        type: array
        items: {type: string, format: objectid}
      canceledAtDate:
        description: 'Date the invoices count as canceled (UTC timestamp in
          milliseconds). Mandatory: omitting it makes the API fail with a type
          error, it is not nullable.'
        type: integer
